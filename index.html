<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Checklist 100 ทริป — มช. สวนสัก</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --card2: #263347; --border: #334155;
    --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; --ok: #22c55e;
    --warn: #f59e0b; --danger: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Sarabun', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 92px; }
  header { position: sticky; top: 0; z-index: 50; background: rgba(15,23,42,0.96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 12px 14px 10px; }
  .top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { font-size: 1.05rem; font-weight: 700; }
  .total-badge { font-weight: 800; font-size: 0.95rem; color: var(--ok); background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4); padding: 3px 10px; border-radius: 999px; }
  .prog-bar { height: 7px; background: #1e293b; border-radius: 999px; overflow: hidden; margin: 8px 0 6px; }
  .prog-fill { height: 100%; background: linear-gradient(90deg, #38bdf8, #22c55e); width: 0%; transition: width .25s; }
  .g-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-size: 0.72rem; text-align: center; }
  .g-pill { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px 2px; color: var(--muted); }
  .g-pill b { color: var(--text); display: block; font-size: 0.82rem; }
  .days-bar { display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px 6px; scrollbar-width: none; }
  .days-bar::-webkit-scrollbar { display: none; }
  .day-btn { flex: 0 0 auto; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--muted); font-size: 0.8rem; font-weight: 600; cursor: pointer; }
  .day-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
  .day-btn.done { border-color: var(--ok); color: var(--ok); }
  .filter-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 14px 8px; font-size: 0.8rem; color: var(--muted); gap: 8px; }
  .filter-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .reset-link { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 4px 8px; font-size: 0.72rem; cursor: pointer; }
  .list { padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .slot-hdr { font-size: 0.82rem; font-weight: 700; color: var(--accent); margin-top: 6px; padding-left: 2px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; transition: opacity .2s; }
  .card.checked { opacity: 0.48; border-color: rgba(34,197,94,0.45); }
  .card.unseen { border-left: 4px solid var(--danger); }
  .card-top { display: flex; align-items: flex-start; gap: 10px; }
  .chk { width: 26px; height: 26px; accent-color: var(--ok); flex-shrink: 0; margin-top: 1px; cursor: pointer; }
  .card-meta { flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 5px; }
  .num { font-weight: 800; font-size: 0.9rem; color: #fff; }
  .pat { font-size: 0.74rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: rgba(56,189,248,0.18); color: #7dd3fc; }
  .note-tag { font-family: ui-monospace, monospace; font-size: 0.74rem; padding: 2px 7px; border-radius: 6px; background: #0f172a; color: #fbbf24; border: 1px solid #475569; }
  .unseen-tag { font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: rgba(239,68,68,0.2); color: #fca5a5; }
  .desc { font-size: 0.92rem; line-height: 1.5; color: #e2e8f0; }
  .desc b { color: #ffffff; }
  .actions { display: flex; gap: 8px; padding-left: 36px; }
  .btn { flex: 1; text-align: center; text-decoration: none; padding: 8px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; border: 1px solid var(--border); background: var(--card2); color: var(--text); cursor: pointer; }
  .btn-map { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.45); color: #86efac; }
  .btn-copy { background: rgba(56,189,248,0.15); border-color: rgba(56,189,248,0.45); color: #7dd3fc; }
  .timer-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 60; background: #0b1220; border-top: 1px solid var(--border); padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .timer-disp { font-family: ui-monospace, monospace; font-size: 1.25rem; font-weight: 800; color: var(--warn); min-width: 72px; }
  .timer-disp.done { color: var(--ok); }
  .t-btns { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .t-btn { padding: 7px 9px; border-radius: 8px; border: 1px solid #475569; background: var(--card); color: #fff; font-size: 0.76rem; font-weight: 700; cursor: pointer; }
  .t-btn.stop { border-color: var(--danger); color: #fca5a5; }
  .toast { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #052e16; font-weight: 800; font-size: 0.85rem; padding: 7px 14px; border-radius: 999px; display: none; z-index: 100; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
</style>
</head>

<header>
  <div class="top-row">
    <h1>📋 Checklist 100 ทริป (มช. สวนสัก)</h1>
    <span class="total-badge" id="total-badge">0 / 100</span>

<div class="days-bar" id="days-bar"></div>

  </div>
</div>

<div class="list" id="trip-list"></div>
<div class="toast" id="toast">คัดลอกแล้ว!</div>

<div class="timer-bar">

    <div class="timer-disp" id="timer-disp">00:00</div>

  <div class="t-btns">
    <button class="t-btn" onclick="startTimer(120)">2:00 น.</button>
    <button class="t-btn" onclick="startTimer(150)">2:30 น.</button>
    <button class="t-btn" onclick="startTimer(210)">3:30 น.</button>
    <button class="t-btn" onclick="startTimer(330)">5:30 น.</button>
    <button class="t-btn stop" onclick="stopTimer()">หยุด</button>
  </div>
</div>

const STORE_KEY = 'cmu_thesis_100trips_v1';
let doneMap = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
let activeDay = 1;

function save() { localStorage.setItem(STORE_KEY, JSON.stringify(doneMap)); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => t.style.display = 'none', 1500);
}

function copyNote(note) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(note).then(() => showToast('ก๊อป note: ' + note + ' แล้ว!'));
  } else {
    prompt('ก๊อปค่า note นี้:', note);
  }
}

function updateStats() {
  const totalDone = TRIPS.filter(t => doneMap[t.id]).length;
  document.getElementById('total-badge').textContent = `${totalDone} / 100`;
  document.getElementById('prog-fill').style.width = `${totalDone}%`;
  ['G0','G1','G2','G3'].forEach(g => {
    const c = TRIPS.filter(t => t.group === g && doneMap[t.id]).length;
    document.getElementById('stat-' + g).textContent = `${c}/25`;
  });
}

function renderDays() {
  const bar = document.getElementById('days-bar');
  bar.innerHTML = '';
  [1,2,3,4,5,6,7,8,0].forEach(d => {
    const list = d === 0 ? TRIPS : TRIPS.filter(t => t.day === d);
    const doneC = list.filter(t => doneMap[t.id]).length;
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (activeDay === d ? ' active' : '') + (doneC === list.length ? ' done' : '');
    btn.textContent = d === 0 ? `ทั้งหมด (${doneC}/100)` : `วันที่ ${d} (${doneC}/${list.length})`;
    btn.onclick = () => { activeDay = d; renderDays(); renderList(); };
    bar.appendChild(btn);
  });
}

function renderList() {
  const container = document.getElementById('trip-list');
  const hideDone = document.getElementById('hide-done').checked;
  const list = TRIPS.filter(t => (activeDay === 0 || t.day === activeDay) && (!hideDone || !doneMap[t.id]));
  container.innerHTML = '';

  let lastHdr = '';
  list.forEach(t => {
    const hdr = `${t.dayLabel} — ${t.slot}`;
    if (hdr !== lastHdr) {
      const h = document.createElement('div');
      h.className = 'slot-hdr';
      h.textContent = hdr;
      container.appendChild(h);
      lastHdr = hdr;
    }
    const card = document.createElement('div');
    card.className = 'card' + (doneMap[t.id] ? ' checked' : '') + (t.unseen ? ' unseen' : '');
    card.innerHTML = `
      <div class="card-top">
        <input type="checkbox" class="chk" ${doneMap[t.id] ? 'checked' : ''} data-id="${t.id}">
        <div class="card-meta">
          <div class="tags">
            <span class="num">#${String(t.id).padStart(2,'0')}</span>
            <span class="pat">${t.pattern}</span>
            <span class="note-tag">note: ${t.note}</span>
            ${t.unseen ? '<span class="unseen-tag">Unseen Test</span>' : ''}
          </div>
          <div class="desc">${t.desc}</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-copy" onclick="copyNote('${t.note}')">📋 ก๊อป note</button>
        <a class="btn btn-map" href="${t.mapsUrl}" target="_blank" rel="noopener">🗺️ เปิด Google Maps</a>
      </div>
    `;
    card.querySelector('.chk').addEventListener('change', (e) => {
      if (e.target.checked) doneMap[t.id] = true; else delete doneMap[t.id];
      save(); updateStats(); renderDays(); renderList();
    });
    container.appendChild(card);
  });
  if (!list.length) {
    container.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:36px 0;">🎉 เก็บครบทุกทริปในวันนี้แล้ว!</div>';
  }
}

let timerInt = null, remSec = 0;
function fmtTime(s) {
  const m = Math.floor(s / 60), r = s % 60;
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = 880;
    osc.connect(ctx.destination); osc.start();
    setTimeout(() => { osc.stop(); ctx.close(); }, 350);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
function startTimer(sec) {
  clearInterval(timerInt);
  remSec = sec;
  const el = document.getElementById('timer-disp');
  el.classList.remove('done');
  el.textContent = fmtTime(remSec);
  timerInt = setInterval(() => {
    remSec--;
    if (remSec <= 0) {
      clearInterval(timerInt);
      el.textContent = 'ครบเวลา!';
      el.classList.add('done');
      beep();
      showToast('⏱ ครบช่วงเวลาแล้ว — กดเปลี่ยนโหมด / Stop ได้!');
    } else {
      el.textContent = fmtTime(remSec);
    }
  }, 1000);
}
function stopTimer() {
  clearInterval(timerInt);
  const el = document.getElementById('timer-disp');
  el.classList.remove('done');
  el.textContent = '00:00';
}

document.getElementById('hide-done').addEventListener('change', renderList);
document.getElementById('btn-export').addEventListener('click', () => {
  prompt('ก๊อปข้อความนี้เก็บไว้สำรอง:', JSON.stringify(doneMap));
});
document.getElementById('btn-import').addEventListener('click', () => {
  const raw = prompt('วาง JSON ที่สำรองไว้:');
  if (!raw) return;
  try { doneMap = JSON.parse(raw); save(); updateStats(); renderDays(); renderList(); showToast('นำเข้าสำเร็จ!'); }
  catch { alert('รูปแบบ JSON ไม่ถูกต้อง'); }
});

updateStats(); renderDays(); renderList();
</script>
